// android/build.gradle
//
// Builds the Android half of the JSI bridge: a small `vroomchart` native
// library (see CMakeLists.txt) plus the TurboModule that installs it
// (see src/main/java/com/vroom/chart). Modeled on
// @shopify/react-native-skia/android/build.gradle and
// react-native-worklets/android/build.gradle, which solve the same
// "compile custom C++ against the RN/RN-Skia JSI internals" problem.

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def reactNativeArchitectures() {
  def value = project.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
}

// Resolves a package's directory via Node's own module resolution, so this
// works whether react-native-vroom-chart is installed flat or (as in this
// monorepo) via pnpm's nested .pnpm store.
def resolvePackageDir(packageJsonSpecifier) {
  def packageJsonPath = providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('${packageJsonSpecifier}')")
  }.standardOutput.asText.get().trim()
  return file(packageJsonPath).parentFile
}

def reactNativeDir = resolvePackageDir("react-native/package.json")

// RN-Skia v3 is published as `react-native-skia`; v2 as
// `@shopify/react-native-skia`. Use whichever is installed.
def tryResolvePackageDir(packageJsonSpecifier) {
  try {
    return resolvePackageDir(packageJsonSpecifier)
  } catch (Exception ignored) {
    return null
  }
}
def skiaPkgDir = tryResolvePackageDir("react-native-skia/package.json")
    ?: resolvePackageDir("@shopify/react-native-skia/package.json")
def skiaCppDir = new File(skiaPkgDir, "cpp")
def skiaMajor = new groovy.json.JsonSlurper()
    .parse(new File(skiaPkgDir, "package.json")).version.tokenize('.')[0] as int

// Skia 2.10+ ships Android prebuilts in react-native-skia-android (Ganesh)
// or react-native-skia-graphite-android (Graphite). v3 is Graphite-only; on v2
// Graphite is selected by the libs/.graphite marker RN-Skia uses. Resolve from
// the skia package so pnpm's nested .pnpm layout still finds the sibling
// binary package.
def useGraphite = skiaMajor >= 3 || new File(skiaPkgDir, "libs/.graphite").exists()
// The Gradle project name doubles as the prefab package name (minus the colon).
def skiaProject = rootProject.findProject(":react-native-skia") != null
    ? ":react-native-skia"
    : ":shopify_react-native-skia"
def skiaAndroidPkgName = useGraphite
    ? "react-native-skia-graphite-android"
    : "react-native-skia-android"
def skiaAndroidPkgJson = providers.exec {
  workingDir(rootDir)
  commandLine("node", "--print",
      "require.resolve('${skiaAndroidPkgName}/package.json', { paths: ['${skiaPkgDir}'] })")
}.standardOutput.asText.get().trim()
def skiaAndroidLibsDir = new File(file(skiaAndroidPkgJson).parentFile, "libs")

// Mirror ../cpp/_core_{src,include} from ../../core/{src,include} whenever
// the monorepo core is present, so edits to packages/core/ propagate on the
// next build without a separate vendoring step. This matches
// ../react-native-vroom-chart.podspec's iOS behavior; a published package
// (no ../../core) falls back to the committed vendored copies instead
// (see ../scripts/vendor-core.mjs).
def coreRoot = file("${projectDir}/../../core")
if (coreRoot.isDirectory()) {
  ["src", "include"].each { sub ->
    def dst = file("${projectDir}/../cpp/_core_${sub}")
    delete dst
    copy {
      from "${coreRoot}/${sub}"
      into dst
    }
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

android {
  namespace "com.vroom.chart"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)

  if (rootProject.hasProperty("ndkPath")) {
    ndkPath rootProject.ext.ndkPath
  }
  if (rootProject.hasProperty("ndkVersion")) {
    ndkVersion rootProject.ext.ndkVersion
  }

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)

    externalNativeBuild {
      cmake {
        abiFilters(*reactNativeArchitectures())
        arguments "-DANDROID_STL=c++_shared",
                  "-DREACT_NATIVE_DIR=${reactNativeDir}",
                  "-DVROOM_SKIA_CPP_DIR=${skiaCppDir}",
                  "-DVROOM_SKIA_ANDROID_LIBS_DIR=${skiaAndroidLibsDir}",
                  "-DVROOM_SKIA_GRAPHITE=${useGraphite ? 'ON' : 'OFF'}",
                  "-DVROOM_SKIA_PREFAB=${skiaProject.substring(1)}"
      }
    }
  }

  buildFeatures {
    // Consumes the `ReactAndroid` prefab package (published by
    // com.facebook.react:react-android) so CMake can `find_package(ReactAndroid)`
    // for the jsi headers/library without us hand-resolving RN's AAR layout.
    prefab true
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  // prefab copies every consumed module's .so into our intermediates. RN and
  // RN-Skia already ship these in their own AARs, so packaging a second copy
  // here makes app assembly fail on duplicate libraries.
  packagingOptions {
    exclude "**/libc++_shared.so"
    exclude "**/libfbjni.so"
    exclude "**/libjsi.so"
    exclude "**/libreactnative.so"
  }

  lintOptions {
    abortOnError false
  }
}

repositories {
  maven {
    url("${reactNativeDir}/android")
  }
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  // ../cpp/VroomChartHostObject.cpp constructs RN-Skia JSI objects
  // (JsiSkPicture, etc.) whose NativeObject base has out-of-line methods
  // compiled into RN-Skia's own native library — we link against its
  // prefab-published `rnskia` package (below, in CMakeLists.txt) rather than
  // recompiling those .cpp files ourselves, to avoid duplicate definitions of
  // RN-Skia's internals across two separately-loaded .so's.
  implementation project(skiaProject)
}
