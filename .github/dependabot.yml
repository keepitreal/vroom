version: 2
updates:
  # One npm entry at the root covers the whole pnpm workspace via the lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Matches minimumReleaseAge in pnpm-workspace.yaml: never propose a release
    # younger than 3 days, so pnpm doesn't reject Dependabot's own lockfile.
    cooldown:
      default-days: 3
    # Major bumps must land together with changesets/action's (see release.yml).
    ignore:
      - dependency-name: "@changesets/cli"
        update-types: ["version-update:semver-major"]
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  # Keeps the SHA-pinned action refs in .github/workflows fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # Major bumps must land together with @changesets/cli's (see release.yml).
    ignore:
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
