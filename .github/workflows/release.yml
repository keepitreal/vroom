name: Release

# Automated releases via Changesets + npm Trusted Publishing (OIDC, no stored
# NPM_TOKEN — provenance is attached automatically). Trusted publishers are
# configured on npmjs.com for each package, pointing at this repo + workflow.
#
# Flow: land changesets on feature PRs (`pnpm changeset`). On push to main,
# Changesets opens a "Version Packages" PR that bumps versions + changelogs.
# Merging THAT PR publishes the bumped packages. A push with no pending
# changesets is a no-op. `workflow_dispatch` is kept for manual re-runs.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC provenance)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Changesets needs full history/tags to compute releases

      # No `version:` here on purpose — pnpm's version comes from the
      # `packageManager` field in package.json. Specifying it in both places
      # makes action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted Publishing (OIDC) needs Node >= 22.14.0; changeset publish
          # authenticates through pnpm (>= 10, pinned in packageManager), whose
          # OIDC support supersedes the globally-installed npm below.
          node-version: 24
          cache: pnpm

      # Trusted Publishing needs npm >= 11.5.1.
      - run: npm i -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version: pnpm run version
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
