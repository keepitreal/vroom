name: Release

# DORMANT — CI publishing is not enabled yet. The project publishes manually for
# now (`npm login` + `pnpm publish --access public` with an OTP). This workflow is
# kept as scaffolding and only runs via manual dispatch so it doesn't fail on
# pushes (it would need an NPM_TOKEN it doesn't have).
#
# To enable automated releases, prefer npm Trusted Publishing (OIDC) over a
# stored token:
#   1. Manually publish each package once (so it exists on npm).
#   2. On npmjs.com, add a Trusted Publisher to each package pointing at this repo
#      + this workflow file.
#   3. Switch the trigger below back to `push: branches: [main]`, add
#      `id-token: write` to permissions, ensure a recent npm
#      (`npm i -g npm@latest`, Trusted Publishing needs npm >= 11.5.1), and drop
#      the NPM_TOKEN/NODE_AUTH_TOKEN env lines from the publish step.
# Once that's done, Changesets opens a "Version Packages" PR on push; merging it
# publishes the bumped packages.

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — pnpm's version comes from the
      # `packageManager` field in package.json. Specifying it in both places
      # makes action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
