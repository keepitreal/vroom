name: Docs

# Builds the Docusaurus site (which fails on broken links and regenerates the
# TypeDoc API reference) and verifies the committed reference is in sync with
# the source types. Vercel deploys separately on push; this is the CI gate.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` here on purpose — pnpm's version comes from the
      # `packageManager` field in package.json. Specifying it in both places
      # makes action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds the site and regenerates docs/content/reference via
      # docusaurus-plugin-typedoc. onBrokenLinks: 'throw' fails on dead links.
      - name: Build docs
        run: pnpm --filter vroom-docs build

      - name: Verify generated API reference is committed
        run: |
          git add -A docs/content/reference
          if ! git diff --cached --exit-code docs/content/reference; then
            echo "::error::API reference is out of date. Run 'pnpm docs:build' and commit docs/content/reference."
            exit 1
          fi
