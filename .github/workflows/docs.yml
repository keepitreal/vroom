name: Docs

# Regenerates the TypeDoc API reference, verifies it's committed in sync with
# the source types, and builds the site (apps/site). Vercel deploys separately
# on push; this is the CI gate.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` here on purpose — pnpm's version comes from the
      # `packageManager` field in package.json. Specifying it in both places
      # makes action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Regenerate API reference
        run: pnpm --filter site reference

      - name: Verify generated API reference is committed
        run: |
          git add -A apps/site/content/docs/reference
          if ! git diff --cached --exit-code apps/site/content/docs/reference; then
            echo "::error::API reference is out of date. Run 'pnpm docs:build' and commit apps/site/content/docs/reference."
            exit 1
          fi

      - name: Build site
        run: pnpm --filter "site^..." build && pnpm --filter site build
