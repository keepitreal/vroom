name: CI

# Build, typecheck and test the published packages, plus a blocking
# dependency-vulnerability gate. The committed WASM binaries mean no emsdk is
# needed here — build:packages is tsup-only.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * *" # daily 09:00 UTC: full audit against newly published advisories
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` here on purpose — pnpm's version comes from the
      # `packageManager` field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:packages

      - run: pnpm -r --filter './packages/*' run typecheck

      - run: pnpm --filter @vroomchart/react --filter react-native-vroom-chart --filter @vroomchart/agent run test

      # An absolute path in the emitted podspec bakes the checkout root into the
      # consumer's SPEC CHECKSUMS and breaks their `pod install --deployment`.
      # Ruby is preinstalled on ubuntu-latest; the check stubs the CocoaPods DSL.
      - run: pnpm --filter react-native-vroom-chart run check:podspec


  # C++ unit tests (doctest via cmake+ctest). Independent of the JS build;
  # runs in parallel with `test` so CI wall-clock time stays the same.
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: sudo apt-get update && sudo apt-get install -y cmake g++ make

      # pnpm is only here to invoke the `test:core` script from root
      # package.json — no `pnpm install` is needed for that.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: pnpm test:core

  # The WASM binary is committed because building it needs Skia, so CI can only
  # check that it was rebuilt after the last change to its inputs. Warning only:
  # some core changes legitimately need no rebuild.
  wasm-fresh:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the committed WASM is rebuilt
        run: |
          # Everything the VROOM_WASM build in packages/core/CMakeLists.txt reads.
          src=(packages/core/src packages/core/include packages/core/web
               packages/core/CMakeLists.txt packages/core/scripts/build-wasm.sh
               ':(exclude)packages/core/web/README.md')
          wasm=packages/core-wasm/assets/vroom_core.wasm

          # HEAD is the PR's merge commit: HEAD^1 is the base, HEAD^2 the PR head.
          changed=$(git diff --name-only HEAD^1 HEAD -- "${src[@]}")
          if [ -z "$changed" ]; then
            echo "No WASM build inputs changed."
            exit 0
          fi

          src_commit=$(git log -1 --format=%H HEAD^1..HEAD^2 -- "${src[@]}")
          wasm_commit=$(git log -1 --format=%H HEAD^1..HEAD^2 -- "$wasm")
          if git diff --quiet HEAD^1 HEAD -- "$wasm"; then
            msg="Core sources feeding the WASM build changed, but $wasm wasn't rebuilt."
          elif [ -n "$src_commit" ] && [ -n "$wasm_commit" ] &&
               ! git merge-base --is-ancestor "$src_commit" "$wasm_commit"; then
            msg="$wasm was last rebuilt in ${wasm_commit:0:7}, before the source change in ${src_commit:0:7}."
          else
            echo "WASM was rebuilt after the latest change to its inputs."
            exit 0
          fi

          hint="If the change affects the web build, run build:wasm (see AGENTS.md) and commit packages/core-wasm/assets/."
          echo "::warning title=WASM may be stale::$msg $hint"
          {
            echo "### WASM may be stale"
            echo
            echo "$msg $hint"
            echo
            echo "Changed inputs:"
            echo '```'
            echo "$changed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # HEAD^1 is the base the PR merges into (or the prior main commit)

      # `audit` is a required check, so the job always runs and reports. A change
      # that leaves the dependency graph alone can't introduce an advisory, so
      # only changes to it are gated; new advisories against existing deps show
      # up in the daily scheduled run instead of failing unrelated PRs.
      - name: Check for dependency changes
        id: deps
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] ||
             git diff --name-only HEAD^1 HEAD | grep -qE '(^|/)package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No dependency changes; skipping audit."
          fi

      - if: steps.deps.outputs.changed == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - if: steps.deps.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - if: steps.deps.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      # Blocking: fails on any high/critical advisory anywhere in the graph.
      # Knowingly-accepted advisories are listed in pnpm.auditConfig.ignoreGhsas
      # in the root package.json, with the reasoning alongside.
      - if: steps.deps.outputs.changed == 'true'
        run: pnpm audit --audit-level high
