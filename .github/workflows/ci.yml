name: CI

# Build, typecheck and test the published packages, plus a blocking
# dependency-vulnerability gate. The committed WASM binaries mean no emsdk is
# needed here — build:packages is tsup-only.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * *" # daily 09:00 UTC: full audit against newly published advisories
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` here on purpose — pnpm's version comes from the
      # `packageManager` field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:packages

      - run: pnpm -r --filter './packages/*' run typecheck

      - run: pnpm --filter @vroomchart/react --filter react-native-vroom-chart run test

      # An absolute path in the emitted podspec bakes the checkout root into the
      # consumer's SPEC CHECKSUMS and breaks their `pod install --deployment`.
      # Ruby is preinstalled on ubuntu-latest; the check stubs the CocoaPods DSL.
      - run: pnpm --filter react-native-vroom-chart run check:podspec


  # C++ unit tests (doctest via cmake+ctest). Independent of the JS build;
  # runs in parallel with `test` so CI wall-clock time stays the same.
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: sudo apt-get update && sudo apt-get install -y cmake g++ make

      # pnpm is only here to invoke the `test:core` script from root
      # package.json — no `pnpm install` is needed for that.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: pnpm test:core

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # HEAD^1 is the base the PR merges into (or the prior main commit)

      # `audit` is a required check, so the job always runs and reports. A change
      # that leaves the dependency graph alone can't introduce an advisory, so
      # only changes to it are gated; new advisories against existing deps show
      # up in the daily scheduled run instead of failing unrelated PRs.
      - name: Check for dependency changes
        id: deps
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] ||
             git diff --name-only HEAD^1 HEAD | grep -qE '(^|/)package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No dependency changes; skipping audit."
          fi

      - if: steps.deps.outputs.changed == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - if: steps.deps.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - if: steps.deps.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      # Blocking: fails on any high/critical advisory anywhere in the graph.
      # Knowingly-accepted advisories are listed in pnpm.auditConfig.ignoreGhsas
      # in the root package.json, with the reasoning alongside.
      - if: steps.deps.outputs.changed == 'true'
        run: pnpm audit --audit-level high
